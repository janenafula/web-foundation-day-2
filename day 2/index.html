<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>QuickNotes</h1>

    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About QuickNotes</a>
    </nav>
  </header>

  <main>
    <section>
      <h2>QuickNotes</h2>
      <p>Capture your thoughts quickly and keep your notes organised.</p>

      <form id="note-form">
        <label for="note">Write a note:</label>
        <input type="text" id="note" name="note" placeholder="Enter your note">
        <button type="submit">Add Note</button>
      </form>
    </section>

    <section>
      <h2>Your Notes</h2>

      <ul>
        <li class="note">Learn HTML</li>
        <li class="note">Practice CSS</li>
        <li class="note">Build with JavaScript</li>
      </ul>
    </section>
  </main>

  <footer>
    <p>QuickNotes &copy; 2026</p>
  </footer>

</body>
</html>
